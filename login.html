<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ArtisanAisle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    <input id="loginInput" type="text" placeholder="Email or Phone Number" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <button onclick="loginUser()">Login</button>
    <div class="link">
      <a href="create-account.html">Create an account</a>
    </div>
  </div>
  <script>
    function getStoredUsers() {
      const rawUsers = localStorage.getItem('handicraft_users');
      if (rawUsers) {
        try {
          const parsed = JSON.parse(rawUsers);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      const legacyUser = localStorage.getItem('handicraft_user');
      if (legacyUser) {
        try {
          const parsed = JSON.parse(legacyUser);
          return parsed ? [parsed] : [];
        } catch (error) {
          return [];
        }
      }

      return [];
    }

    function loginUser() {
      const identifier = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!identifier || !password) {
        alert('Please enter your email/phone and password.');
        return;
      }

      const users = getStoredUsers();
      const normalizedIdentifier = identifier.toLowerCase();
      const normalizedPhone = identifier.replace(/\D/g, '');

      const storedUser = users.find(user => {
        const existingEmail = (user.email || '').toLowerCase();
        const existingPhone = (user.phone || '').replace(/\D/g, '');
        return existingEmail === normalizedIdentifier || existingPhone === normalizedPhone;
      });

      if (!storedUser || storedUser.password !== password) {
        alert('Invalid email/phone or password.');
        return;
      }

      localStorage.setItem('handicraft_logged_in_user', JSON.stringify({ name: storedUser.name, email: storedUser.email, phone: storedUser.phone }));
      localStorage.setItem('handicraft_profile', JSON.stringify({ name: storedUser.name, email: storedUser.email, phone: storedUser.phone }));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
