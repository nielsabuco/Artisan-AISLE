<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ArtisanAisle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    <input id="loginInput" type="email" autocomplete="email" placeholder="Email address" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <button id="loginButton" onclick="loginUser()">Login</button>
    <div class="social-login" aria-label="Social login options">
      <button type="button" class="secondary-btn" onclick="loginWithProvider('google')">Continue with Google</button>
      <button type="button" class="secondary-btn" onclick="loginWithProvider('facebook')">Continue with Facebook</button>
    </div>
    <div class="link">
      <a href="index.html?admin=1">Admin login</a>
    </div>
    <div class="link">
      <a href="create-account.html">Create an account</a>
    </div>
  </div>
  <script type="module" src="firebase-config.js"></script>
  <script>
  (async () => {
    // Wait for Firebase to be ready
    await new Promise(resolve => {
      const checkFirebase = () => {
        if (window.firebaseApi) {
          resolve();
        } else {
          setTimeout(checkFirebase, 10);
        }
      };
      checkFirebase();
    });

    async function loginUser() {
      const identifier = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!identifier || !password) {
        alert('Please enter your email and password.');
        return;
      }

      if (!/^\S+@\S+\.\S+$/.test(identifier)) {
        alert('Please enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        alert('Your password must be at least 6 characters.');
        return;
      }
      const button = document.getElementById('loginButton');
      button.disabled = true;
      try {
        await window.firebaseApi.authReady;
        const result = await window.firebaseApi.signIn(identifier.toLowerCase(), password);
        const storedProfile = await window.firebaseApi.getUserProfile(result.user.uid);
        const fullName = storedProfile?.name || storedProfile?.firstName || storedProfile?.firstname || result.user.displayName || '';
        const userProfile = {
          ...(storedProfile || {}),
          name: fullName,
          firstName: fullName.trim().split(/\s+/)[0] || result.user.email.split('@')[0],
          email: storedProfile?.email || result.user.email
        };
        localStorage.setItem('handicraft_logged_in_user', JSON.stringify(userProfile));
        localStorage.setItem('handicraft_profile', JSON.stringify(userProfile));
        window.location.href = 'index.html';
      } catch (error) {
        alert(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found'
          ? 'Invalid email or password.'
          : error.message || 'Unable to log in.');
        button.disabled = false;
      }
    }

    async function loginWithProvider(providerName) {
      const buttons = document.querySelectorAll('.social-login button');
      buttons.forEach(button => { button.disabled = true; });
      try {
        await window.firebaseApi.authReady;
        const user = providerName === 'google'
          ? await window.firebaseApi.signInWithGoogle()
          : await window.firebaseApi.signInWithFacebook();
        const storedProfile = await window.firebaseApi.getUserProfile(user.uid);
        const name = storedProfile?.name || user.displayName || user.email?.split('@')[0] || 'Customer';
        const userProfile = { ...(storedProfile || {}), name, firstName: name.split(/\s+/)[0], email: user.email };
        localStorage.setItem('handicraft_logged_in_user', JSON.stringify(userProfile));
        localStorage.setItem('handicraft_profile', JSON.stringify(userProfile));
        window.location.href = 'index.html';
      } catch (error) {
        alert(error.code === 'auth/account-exists-with-different-credential'
          ? 'This email already uses another sign-in method.'
          : error.message || 'Social login failed.');
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    window.loginWithProvider = loginWithProvider;
    window.loginUser = loginUser;
  })();
  </script>
</body>
</html>
