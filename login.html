<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ArtisanAisle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    <p style="color:#666; font-size:14px; margin-bottom:15px;">Sign in to your ArtisanAisle account.</p>

    <!-- Google Sign In -->
    <button id="googleLoginBtn" type="button" class="btn-google" onclick="loginWithGoogle()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or with email</span></div>

    <input id="loginInput" type="email" placeholder="Email Address" required />
    <input id="passwordInput" type="password" placeholder="Password" required />
    <button id="loginBtn" type="button" onclick="loginUser()">Login</button>

    <div class="link">
      <a href="create-account.html">Create an account</a>
    </div>
    <div class="link" style="margin-top:10px;">
      <a href="index.html">Back to Storefront</a>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script>
    async function loginUser() {
      const email = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        alert('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Logging in...';

      try {
        let loggedUser = null;
        if (window.ArtisanDB) {
          loggedUser = await window.ArtisanDB.loginUser(email, password);
        } else {
          loggedUser = {
            email,
            name: email.split('@')[0],
            role: 'user',
            sellerStatus: 'none'
          };
          localStorage.setItem('handicraft_logged_in_user', JSON.stringify(loggedUser));
        }

        handlePostAuthRedirect(loggedUser);
      } catch (err) {
        console.error('Login error:', err);
        let msg = 'Invalid email or password.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = 'Invalid email or password. Please verify your credentials.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        alert(msg);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Login';
      }
    }

    async function loginWithGoogle() {
      const btn = document.getElementById('googleLoginBtn');
      btn.disabled = true;
      btn.innerText = 'Connecting to Google...';

      try {
        const db = window.ArtisanDB || window.firebaseApi;
        if (!db || !db.loginWithGoogle) {
          throw new Error('Authentication is initializing. Please wait a moment and try again.');
        }

        const userProfile = await db.loginWithGoogle();
        handlePostAuthRedirect(userProfile);
      } catch (err) {
        console.error('Google sign-in error:', err);
        if (err.code === 'auth/popup-closed-by-user') {
          // Closed by user, no alert needed
        } else if (err.code === 'auth/account-exists-with-different-credential') {
          alert('An account already exists with the same email using a different sign-in method.');
        } else {
          alert(err.message || 'Failed to sign in with Google. Please try again.');
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg> Continue with Google`;
      }
    }

    function handlePostAuthRedirect(user) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectTarget = urlParams.get('redirect');

      if (redirectTarget) {
        window.location.href = redirectTarget;
        return;
      }

      const db = window.ArtisanDB || window.firebaseApi;
      const isAdmin = user && (String(user.role || '').toLowerCase() === 'admin' || (db && db.isEmailAdmin && db.isEmailAdmin(user.email)));

      if (isAdmin) {
        window.location.href = 'admin.html';
        return;
      }

      if (user && (user.role === 'seller' || user.sellerStatus === 'approved')) {
        const gotoSeller = confirm('Welcome back, Artisan! Would you like to go to your Seller Portal?');
        if (gotoSeller) {
          window.location.href = 'seller.html';
          return;
        }
      }

      window.location.href = 'profile.html';
    }

    window.loginUser = loginUser;
    window.loginWithGoogle = loginWithGoogle;
  </script>
</body>
</html>
