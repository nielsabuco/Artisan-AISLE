<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | ArtisanAisle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <h1>Create Account</h1>
    <p style="color:#666; font-size:14px; margin-bottom:15px;">Register for an ArtisanAisle customer account.</p>
    <input id="nameInput" type="text" placeholder="Full Name" required />
    <input id="emailInput" type="email" placeholder="Email" required />
    <input id="phoneInput" type="tel" placeholder="Phone Number (09XXXXXXXXX)" required />
    <input id="passwordInput" type="password" placeholder="Password (minimum 6 characters)" required />
    <button id="createBtn" type="button" onclick="createAccount()">Create Account</button>
    <div class="link">
      <a href="login.html">Already have an account? Log in</a>
    </div>
    <div class="link" style="margin-top:10px;">
      <a href="index.html">Back to Storefront</a>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script>
    async function createAccount() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('createBtn');

      if (!name || !email || !phone || !password) {
        alert('Please fill in all fields.');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Creating Account...';

      try {
        if (window.ArtisanDB) {
          // Register via Firebase Auth and Firestore with default role 'user'
          await window.ArtisanDB.registerUser(name, email, phone, password);
        } else {
          // Local fallback
          const localUser = {
            uid: 'u_' + Date.now(),
            name,
            email,
            phone,
            role: 'user',
            sellerStatus: 'none'
          };
          localStorage.setItem('handicraft_logged_in_user', JSON.stringify(localUser));
        }

        alert('Account created successfully! Welcome to ArtisanAisle.');
        window.location.href = 'index.html';
      } catch (err) {
        console.error('Registration error:', err);
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          msg = 'An account with this email address already exists. Please log in.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        } else if (err.code === 'auth/weak-password') {
          msg = 'Password should be at least 6 characters.';
        }
        alert(msg);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Create Account';
      }
    }
  </script>
</body>
</html>
