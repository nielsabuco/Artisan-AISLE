<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | ArtisanAisle</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <div class="auth-brand-header">
      <a href="index.html" title="Artisan Aisle Storefront">
        <img src="images/logo.svg" alt="Artisan Aisle Complete Logo" class="auth-brand-logo" />
      </a>
    </div>
    <h1>Create Account</h1>
    <p style="color:#666; font-size:14px; margin-bottom:15px;">Register for an ArtisanAisle customer account.</p>

    <!-- Google Sign Up -->
    <button id="googleSignUpBtn" type="button" class="btn-google" onclick="signUpWithGoogle()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="auth-divider"><span>or with email</span></div>

    <input id="nameInput" type="text" placeholder="Full Name" required />
    <input id="emailInput" type="email" placeholder="Email" required />
    <input id="phoneInput" type="tel" placeholder="Phone Number (09XXXXXXXXX)" required />
    <input id="passwordInput" type="password" placeholder="Password (minimum 6 characters)" required />
    <button id="createBtn" type="button" onclick="createAccount()">Create Account</button>

    <div class="link">
      <a href="login.html">Already have an account? Log in</a>
    </div>
    <div class="link" style="margin-top:10px;">
      <a href="index.html">Back to Storefront</a>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script>
    async function createAccount() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('createBtn');

      if (!name || !email || !phone || !password) {
        alert('Please fill in all fields.');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Creating Account...';

      try {
        if (window.ArtisanDB) {
          await window.ArtisanDB.registerUser(name, email, phone, password);
        } else {
          const localUser = {
            uid: 'u_' + Date.now(),
            name,
            email,
            phone,
            role: 'user',
            sellerStatus: 'none'
          };
          localStorage.setItem('handicraft_logged_in_user', JSON.stringify(localUser));
        }

        alert('Account created successfully! Welcome to ArtisanAisle.');
        window.location.href = 'profile.html';
      } catch (err) {
        console.error('Registration error:', err);
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          msg = 'An account with this email address already exists. Please log in.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        } else if (err.code === 'auth/weak-password') {
          msg = 'Password should be at least 6 characters.';
        }
        alert(msg);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Create Account';
      }
    }

    async function signUpWithGoogle() {
      const btn = document.getElementById('googleSignUpBtn');
      btn.disabled = true;
      btn.innerText = 'Connecting to Google...';

      try {
        const db = window.ArtisanDB || window.firebaseApi;
        if (!db || !db.loginWithGoogle) {
          throw new Error('Authentication service is still initializing. Please try again.');
        }

        await db.loginWithGoogle();
        alert('Signed in with Google! Welcome to ArtisanAisle.');
        window.location.href = 'profile.html';
      } catch (err) {
        console.error('Google sign-up error:', err);
        if (err.code === 'auth/popup-closed-by-user') {
          // User closed popup
        } else if (err.code === 'auth/account-exists-with-different-credential') {
          alert('An account already exists with the same email using a different sign-in method.');
        } else {
          alert(err.message || 'Unable to sign up with Google. Please try again.');
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg> Sign up with Google`;
      }
    }

    window.createAccount = createAccount;
    window.signUpWithGoogle = signUpWithGoogle;
  </script>
</body>
</html>
