<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | ArtisanAisle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="box">
    <h1>Create Account</h1>
    <input id="nameInput" type="text" autocomplete="name" placeholder="Full Name" />
    <input id="emailInput" type="email" autocomplete="email" placeholder="Email" />
    <input id="phoneInput" type="tel" autocomplete="tel" placeholder="Phone Number" />
    <input id="passwordInput" type="password" autocomplete="new-password" placeholder="Password (6+ characters)" />
    <button id="createAccountButton" onclick="createAccount()">Create Account</button>
    <div class="social-login" aria-label="Social account creation options">
      <button type="button" class="secondary-btn" onclick="createWithProvider('google')">Create with Google</button>
      <button type="button" class="secondary-btn" onclick="createWithProvider('facebook')">Create with Facebook</button>
    </div>
    <div class="link">
      <a href="login.html">Already have an account?</a>
    </div>
  </div>
  <script type="module" src="firebase-config.js"></script>
  <script>
  (async () => {
    // Wait for Firebase to be ready
    await new Promise(resolve => {
      const checkFirebase = () => {
        if (window.firebaseApi) {
          resolve();
        } else {
          setTimeout(checkFirebase, 10);
        }
      };
      checkFirebase();
    });

    async function createAccount() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!name || !email || !phone || !password) {
        alert('Please fill in all fields.');
        return;
      }

      if (!/^\S+@\S+\.\S+$/.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        alert('Your password must be at least 6 characters.');
        return;
      }

      const normalizedPhone = phone.replace(/\D/g, '');
      if (normalizedPhone.length < 10) {
        alert('Please enter a valid phone number.');
        return;
      }

      const button = document.getElementById('createAccountButton');
      button.disabled = true;
      try {
        await window.firebaseApi.authReady;
        await window.firebaseApi.signUp({ name, email, phone, password });
        localStorage.setItem('handicraft_logged_in_user', JSON.stringify({ name, email, phone }));
        localStorage.setItem('handicraft_profile', JSON.stringify({ name, email, phone }));
        window.location.href = 'index.html';
      } catch (error) {
        alert(error.code === 'auth/email-already-in-use' ? 'An account with this email already exists.' : error.message);
        button.disabled = false;
      }
    }

    async function createWithProvider(providerName) {
      const buttons = document.querySelectorAll('.social-login button');
      buttons.forEach(button => { button.disabled = true; });
      try {
        await window.firebaseApi.authReady;
        const user = providerName === 'google'
          ? await window.firebaseApi.signInWithGoogle()
          : await window.firebaseApi.signInWithFacebook();
        const name = user.displayName || user.email?.split('@')[0] || 'Customer';
        const userProfile = { name, firstName: name.split(/\s+/)[0], email: user.email, photoURL: user.photoURL || '' };
        localStorage.setItem('handicraft_logged_in_user', JSON.stringify(userProfile));
        localStorage.setItem('handicraft_profile', JSON.stringify(userProfile));
        window.location.href = 'index.html';
      } catch (error) {
        alert(error.message || 'Unable to create the account with this provider.');
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    window.createWithProvider = createWithProvider;
    window.createAccount = createAccount;
  })();
  </script>
</body>
</html>
